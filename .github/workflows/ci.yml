name: CI

on:
  push:
    branches:
      - 'main'
      - 'renovate/**'
  pull_request:

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'yarn'
      - run: yarn install
      - run: yarn build
      # disabled steps for now
      # - run: yarn lint
      # - run: yarn test

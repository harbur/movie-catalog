name: CI

on:
  push:
    branches:
      - 'main'
      - 'renovate/**'
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: cd backend && go mod download

      - name: Vet
        run: cd backend && go vet ./...

      - name: Run tests
        run: cd backend && go test ./... -covermode=atomic -coverprofile=coverage.out

      - name: Coverage summary
        id: coverage
        run: |
          cd backend
          PERCENT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "### Backend coverage: $PERCENT" >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: UI
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: ui/yarn.lock

      - name: Install dependencies
        run: cd ui && yarn install --frozen-lockfile

      - name: Lint
        run: cd ui && yarn lint

      - name: Run tests
        run: cd ui && yarn test:coverage

      - name: Coverage summary
        id: coverage
        run: |
          cd ui
          PERCENT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "percent=$PERCENT%" >> "$GITHUB_OUTPUT"
          echo "### UI coverage: $PERCENT%" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: cd ui && yarn build

  coverage-comment:
    name: Coverage comment
    needs: [backend, ui]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment coverage on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- coverage-report -->'
            const backend = '${{ needs.backend.outputs.coverage }}' || '_unavailable_'
            const ui = '${{ needs.ui.outputs.coverage }}' || '_unavailable_'
            const body = `${marker}\n## Test coverage\n\n| Suite | Coverage |\n| --- | --- |\n| Backend (Go, statements) | ${backend} |\n| UI (lines) | ${ui} |\n`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
